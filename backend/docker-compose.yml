# ========================================
# AI Fruit Identification Assistant
# Docker Compose Configuration
# ========================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fruit_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fruit_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fruit_ai_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fruit_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fruit_ai_network

  # Backend API
  backend:
    build: .
    container_name: fruit_ai_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/fruit_ai_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=True
      - MOCK_ML_MODEL=True
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - fruit_ai_network
    restart: unless-stopped

  # Celery Worker (Background Tasks)
  celery:
    build: .
    container_name: fruit_ai_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/fruit_ai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./static:/app/static
    networks:
      - fruit_ai_network
    restart: unless-stopped

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build: .
    container_name: fruit_ai_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/fruit_ai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - fruit_ai_network
    restart: unless-stopped

# Volumes
volumes:
  postgres_data:
  redis_data:

# Networks
networks:
  fruit_ai_network:
    driver: bridge